<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IPA Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a1f1c;
        --muted: #5c6760;
        --line: #d4ddd6;
        --surface: #f3f6f3;
        --paper: #fafcf9;
        --accent: #0d7a5f;
        --accent-soft: #d8efe6;
        --danger: #a61e1e;
        --danger-soft: #f8e4e4;
        --warn: #8a5a00;
        --warn-soft: #f5edd8;
        --radius: 10px;
        --composer-radius: 1.35rem;
        --font: "IBM Plex Sans", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: var(--font);
        color: var(--ink);
        background:
          radial-gradient(ellipse 80% 50% at 10% -10%, #e4f2ec 0%, transparent 55%),
          radial-gradient(ellipse 60% 40% at 100% 0%, #eef1e8 0%, transparent 50%),
          var(--paper);
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
        padding: 1.25rem 1.5rem 0.75rem;
        max-width: 42rem;
        width: 100%;
        margin: 0 auto;
      }

      h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      h1 span {
        color: var(--muted);
        font-weight: 400;
        font-size: 0.85rem;
        margin-left: 0.4rem;
      }

      .header-meta {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .gallery {
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--muted);
        text-decoration: none;
        white-space: nowrap;
        border-radius: 2px;
      }

      .gallery:hover {
        color: var(--accent);
      }

      .source {
        display: inline-flex;
        color: var(--muted);
        line-height: 0;
        border-radius: 2px;
      }

      .source svg {
        width: 1.05rem;
        height: 1.05rem;
      }

      .source:hover {
        color: var(--accent);
      }

      .gallery:focus-visible,
      .source:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      #status {
        font-family: var(--mono);
        font-size: 0.72rem;
        padding: 0.3rem 0.55rem;
        border-radius: 999px;
        white-space: nowrap;
      }

      #status.ready {
        background: var(--accent-soft);
        color: var(--accent);
      }

      #status.missing {
        background: var(--warn-soft);
        color: var(--warn);
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        max-width: 42rem;
        width: 100%;
        margin: 0 auto;
        padding: 0 1.5rem 1.25rem;
        min-height: 0;
      }

      #log {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 0.5rem 0 1rem;
        min-height: 12rem;
      }

      .msg {
        max-width: 92%;
        padding: 0.7rem 0.9rem;
        border-radius: var(--radius);
        line-height: 1.45;
        font-size: 0.95rem;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .msg.user {
        align-self: flex-end;
        background: var(--ink);
        color: var(--paper);
      }

      .msg.user.failed {
        background: var(--danger-soft);
        color: var(--danger);
        border: 1px solid #efc4c4;
      }

      .msg.assistant {
        align-self: flex-start;
        background: var(--surface);
        border: 1px solid var(--line);
      }

      .msg.meta {
        align-self: stretch;
        max-width: 100%;
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--muted);
        background: transparent;
        border: none;
        padding: 0.25rem 0;
      }

      .msg.error {
        align-self: stretch;
        max-width: 100%;
        background: var(--danger-soft);
        color: var(--danger);
        border: 1px solid #efc4c4;
        font-size: 0.875rem;
      }

      .msg .label {
        display: block;
        font-family: var(--mono);
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.7;
        margin-bottom: 0.25rem;
      }

      .msg.assistant.pending .body {
        display: none;
      }

      .reasoning {
        display: none;
        margin: 0 0 0.55rem;
        padding: 0;
        border: none;
        background: transparent;
      }

      .msg.assistant.has-reasoning .reasoning {
        display: block;
      }

      .reasoning > summary {
        cursor: pointer;
        font-family: var(--mono);
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        list-style: none;
        user-select: none;
      }

      .reasoning > summary::-webkit-details-marker {
        display: none;
      }

      .reasoning > summary::before {
        content: "▸ ";
        display: inline-block;
        width: 0.85em;
      }

      .reasoning[open] > summary::before {
        content: "▾ ";
      }

      .reasoning > summary:hover {
        color: var(--ink);
      }

      .reasoning-body {
        margin-top: 0.4rem;
        padding: 0.55rem 0.65rem;
        border-radius: 6px;
        background: rgba(26, 31, 28, 0.04);
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.4;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .typing {
        display: none;
        align-items: center;
        gap: 0.35rem;
        min-height: 1.35em;
        color: var(--muted);
      }

      .msg.assistant.pending .typing {
        display: inline-flex;
      }

      .msg.assistant.pending.has-reasoning .typing {
        display: none;
      }

      .typing-label {
        font-family: var(--mono);
        font-size: 0.75rem;
      }

      .typing-dots {
        display: inline-flex;
        gap: 0.2rem;
        align-items: center;
      }

      .typing-dots span {
        width: 0.35rem;
        height: 0.35rem;
        border-radius: 50%;
        background: var(--muted);
        opacity: 0.35;
        animation: typing-bounce 1.2s ease-in-out infinite;
      }

      .typing-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .typing-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes typing-bounce {
        0%,
        80%,
        100% {
          opacity: 0.35;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-0.15rem);
        }
      }

      .composer {
        margin-top: auto;
        padding-top: 0.5rem;
      }

      .composer-shell {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        padding: 0.7rem 0.75rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: var(--composer-radius);
        background: #fff;
        box-shadow:
          0 1px 2px rgba(26, 31, 28, 0.04),
          0 8px 24px rgba(26, 31, 28, 0.04);
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      .composer-shell:focus-within {
        border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
        box-shadow:
          0 1px 2px rgba(26, 31, 28, 0.04),
          0 8px 24px rgba(13, 122, 95, 0.08),
          0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
      }

      textarea {
        display: block;
        width: 100%;
        resize: none;
        min-height: 1.5rem;
        max-height: 10rem;
        padding: 0.35rem 0.4rem 0.15rem;
        border: none;
        background: transparent;
        font: inherit;
        color: inherit;
        line-height: 1.45;
        field-sizing: content;
      }

      textarea:focus {
        outline: none;
      }

      textarea:disabled {
        opacity: 0.6;
      }

      textarea::placeholder {
        color: color-mix(in srgb, var(--muted) 75%, transparent);
      }

      .attach-preview {
        display: none;
        flex-wrap: wrap;
        gap: 0.45rem;
        padding: 0 0.15rem 0.15rem;
      }

      .attach-preview:not(:empty) {
        display: flex;
      }

      .attach-thumb {
        position: relative;
        width: 4.25rem;
        height: 4.25rem;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: var(--surface);
        flex-shrink: 0;
      }

      .attach-thumb img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .attach-remove {
        position: absolute;
        top: 0.2rem;
        right: 0.2rem;
        width: 1.25rem;
        height: 1.25rem;
        padding: 0;
        border: none;
        border-radius: 999px;
        background: rgba(26, 31, 28, 0.72);
        color: #fff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }

      .attach-remove svg {
        width: 0.7rem;
        height: 0.7rem;
      }

      .attach-remove:hover {
        background: rgba(26, 31, 28, 0.9);
      }

      .attach-remove:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .msg-images {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin: 0.15rem 0 0.45rem;
      }

      .msg-images:empty {
        display: none;
      }

      .msg-images img {
        display: block;
        max-width: min(12rem, 100%);
        max-height: 10rem;
        border-radius: 6px;
        object-fit: cover;
        border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
      }

      .msg.user .msg-images img {
        border-color: rgba(250, 252, 249, 0.2);
      }

      .composer-shell.dragover {
        border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
        box-shadow:
          0 1px 2px rgba(26, 31, 28, 0.04),
          0 8px 24px rgba(13, 122, 95, 0.1),
          0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
      }

      .composer-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .composer-tools {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        min-width: 0;
      }

      .composer-actions {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        flex-shrink: 0;
      }

      .tool-toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font: inherit;
        font-size: 0.8rem;
        font-weight: 500;
        padding: 0.35rem 0.65rem;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        line-height: 1.2;
        white-space: nowrap;
      }

      .tool-toggle svg {
        width: 0.95rem;
        height: 0.95rem;
        flex-shrink: 0;
      }

      .tool-toggle:hover:not(:disabled) {
        background: var(--surface);
        color: var(--ink);
      }

      .tool-toggle[aria-pressed="true"] {
        background: var(--accent-soft);
        border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
        color: var(--accent);
      }

      .tool-toggle[aria-pressed="true"]:hover:not(:disabled) {
        background: color-mix(in srgb, var(--accent-soft) 80%, #fff);
        color: var(--accent);
      }

      .tool-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .tool-toggle:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.15rem;
        height: 2.15rem;
        padding: 0;
        border: none;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        flex-shrink: 0;
      }

      .icon-btn svg {
        width: 1.1rem;
        height: 1.1rem;
      }

      .icon-btn svg[hidden] {
        display: none;
      }

      .icon-btn:hover:not(:disabled) {
        background: var(--surface);
        color: var(--ink);
      }

      .icon-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .icon-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .icon-btn.primary {
        background: var(--accent);
        color: #fff;
      }

      .icon-btn.primary:hover:not(:disabled) {
        filter: brightness(1.06);
        background: var(--accent);
        color: #fff;
      }

      .icon-btn.primary:disabled {
        opacity: 0.4;
        filter: none;
      }

      .icon-btn.primary[data-mode="stop"] {
        background: var(--ink);
        color: var(--paper);
      }

      .icon-btn.primary[data-mode="stop"]:hover:not(:disabled) {
        filter: brightness(1.1);
        background: var(--ink);
        color: var(--paper);
      }

      .hint {
        margin: 0.45rem 0.15rem 0;
        font-family: var(--mono);
        font-size: 0.68rem;
        color: var(--muted);
        text-align: center;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }

        .typing-dots {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>IPA Demo<span>window.inference</span></h1>
      <div class="header-meta">
        <a class="gallery" href="../">All examples</a>
        <a
          class="source"
          href="https://github.com/SamSamskies/inference-provider-api/tree/main/examples/chat"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Source on GitHub"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"
            />
          </svg>
        </a>
        <div id="status" class="missing" role="status">checking…</div>
      </div>
    </header>

    <main>
      <div id="log" aria-live="polite"></div>

      <div class="composer">
        <form id="form" class="composer-shell">
          <div id="attach-preview" class="attach-preview" aria-live="polite"></div>
          <textarea
            id="input"
            rows="1"
            placeholder="Message…"
            autocomplete="off"
            disabled
          ></textarea>
          <div class="composer-toolbar">
            <div class="composer-tools">
              <input
                type="file"
                id="attach-input"
                accept="image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg,.png,.webp,.gif"
                multiple
                hidden
              />
              <button
                type="button"
                id="attach"
                class="tool-toggle"
                disabled
                aria-label="Attach images"
                title="Image input unavailable"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M4.75 2.5a2.75 2.75 0 0 0-2.75 2.75v5.5a4.25 4.25 0 0 0 8.5 0V4.75a.75.75 0 0 1 1.5 0v5.999a5.75 5.75 0 1 1-11.5 0v-5.5a4.25 4.25 0 0 1 8.5 0v5.5a2.75 2.75 0 1 1-5.5 0V5.5a.75.75 0 0 1 1.5 0v4.75a1.25 1.25 0 1 0 2.5 0v-5.5A2.75 2.75 0 0 0 4.75 2.5"
                  />
                </svg>
                Attach
              </button>
              <button
                type="button"
                id="web-search"
                class="tool-toggle"
                aria-pressed="false"
                disabled
                title="Hosted web search unavailable"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0M1.5 8a6.5 6.5 0 0 1 .23-1.7h2.85a13 13 0 0 0-.1 1.7c0 .58.03 1.15.1 1.7H1.73A6.5 6.5 0 0 1 1.5 8m1.06 3.2h2.5c.24.9.57 1.72.97 2.4A6.52 6.52 0 0 1 2.56 11.2m0-6.4a6.52 6.52 0 0 1 3.47-2.4c-.4.68-.73 1.5-.97 2.4zm3.66 3.2c0-.55.03-1.08.09-1.6h2.38c.06.52.09 1.05.09 1.6s-.03 1.08-.09 1.6H6.31A12 12 0 0 1 6.22 8m.2 3.2h2.16c-.25.95-.6 1.78-1.08 2.4-.48-.62-.83-1.45-1.08-2.4m0-6.4c.25-.95.6-1.78 1.08-2.4.48.62.83 1.45 1.08 2.4zm3.47 0h2.5a6.52 6.52 0 0 0-3.47-2.4c.4.68.73 1.5.97 2.4m0 6.4c-.24.9-.57 1.72-.97 2.4a6.52 6.52 0 0 0 3.47-2.4zm.85-4.8h2.85A6.5 6.5 0 0 1 14.5 8a6.5 6.5 0 0 1-.23 1.7h-2.85a13 13 0 0 0 .1-1.7 13 13 0 0 0-.1-1.7"
                  />
                </svg>
                Search
              </button>
            </div>
            <div class="composer-actions">
              <button
                type="submit"
                id="primary"
                class="icon-btn primary"
                data-mode="send"
                disabled
                aria-label="Send message"
                title="Send"
              >
                <svg class="icon-send" viewBox="0 0 16 16" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M8 13.75a.75.75 0 0 1-.75-.75V5.31L4.53 8.03a.75.75 0 0 1-1.06-1.06l4-4a.75.75 0 0 1 1.06 0l4 4a.75.75 0 1 1-1.06 1.06L8.75 5.31V13a.75.75 0 0 1-.75.75"
                  />
                </svg>
                <svg class="icon-stop" viewBox="0 0 16 16" aria-hidden="true" hidden>
                  <rect x="4" y="4" width="8" height="8" rx="1.25" fill="currentColor" />
                </svg>
              </button>
            </div>
          </div>
        </form>
        <p class="hint" id="composer-hint">Enter to send · Shift+Enter for a new line</p>
      </div>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const primaryBtn = document.getElementById("primary");
      const attachBtn = document.getElementById("attach");
      const attachInput = document.getElementById("attach-input");
      const attachPreview = document.getElementById("attach-preview");
      const webSearchBtn = document.getElementById("web-search");
      const composerHint = document.getElementById("composer-hint");
      const sendIcon = primaryBtn.querySelector(".icon-send");
      const stopIcon = primaryBtn.querySelector(".icon-stop");

      const ACCEPTED_IMAGE_TYPES = new Set([
        "image/jpeg",
        "image/png",
        "image/webp",
        "image/gif",
      ]);
      const MAX_ATTACHMENTS = 8;

      /** @type {AbortController | null} */
      let activeController = null;

      /** @type {{ role: "user" | "assistant"; content: string | object[] }[]} */
      const history = [];

      /**
       * Pending uploads for the next send.
       * @type {{ id: string; file: File; mediaType: string; objectUrl: string }[]}
       */
      let pendingAttachments = [];

      let webSearchEnabled = false;
      let webSearchAvailable = false;
      let imageInputAvailable = false;
      let dragDepth = 0;

      function getFeatures() {
        try {
          return window.inference?.getFeatures?.() ?? {};
        } catch {
          return {};
        }
      }

      function normalizeMediaType(type) {
        const t = (type || "").toLowerCase();
        if (t === "image/jpg") return "image/jpeg";
        return t;
      }

      function isAcceptedImageFile(file) {
        return ACCEPTED_IMAGE_TYPES.has(normalizeMediaType(file.type));
      }

      function buildWebSearchSystemPrompt() {
        const now = new Date();
        const localDateTime = now.toLocaleString("en-US", {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit",
          timeZoneName: "short",
        });
        return (
          `The user's local date and time is ${localDateTime}. ` +
          "You have access to hosted web search. " +
          "For questions about current events, news, weather, what is happening \"today\" / \"this week\" / \"right now\" / \"recently\", live data, or anything that may have changed since your training cutoff, you must use web search before answering. " +
          "Do not answer those from memory alone — search first, then summarize what you found. " +
          "When stating a time, use the search results (or say the time is approximate) — do not invent a clock time. " +
          "Cite sources when you search."
        );
      }

      function updateComposerHint() {
        const parts = [];
        if (webSearchEnabled) {
          parts.push("Search on · model may use hosted web search if needed");
        } else {
          parts.push("Enter to send · Shift+Enter for a new line");
        }
        if (imageInputAvailable) {
          parts.push("attach, paste, or drop images");
        }
        composerHint.textContent = parts.join(" · ");
      }

      function syncWebSearchControl() {
        webSearchAvailable =
          Boolean(window.inference) && getFeatures().webSearch === true;
        if (!webSearchAvailable) webSearchEnabled = false;
        webSearchBtn.disabled = !webSearchAvailable || Boolean(activeController);
        webSearchBtn.setAttribute(
          "aria-pressed",
          webSearchEnabled ? "true" : "false",
        );
        webSearchBtn.title = webSearchAvailable
          ? webSearchEnabled
            ? "Web search on — model may use hosted search"
            : "Web search off — click to allow hosted search"
          : "Hosted web search unavailable (getFeatures().webSearch)";
        updateComposerHint();
      }

      function syncAttachControl() {
        imageInputAvailable =
          Boolean(window.inference) && getFeatures().imageInput === true;
        if (!imageInputAvailable && pendingAttachments.length) {
          clearAttachments();
        }
        attachBtn.disabled = !imageInputAvailable || Boolean(activeController);
        attachBtn.title = imageInputAvailable
          ? "Attach images (jpeg, png, webp, gif)"
          : "Image input unavailable (getFeatures().imageInput)";
        attachBtn.setAttribute(
          "aria-label",
          imageInputAvailable ? "Attach images" : "Image input unavailable",
        );
        updateComposerHint();
      }

      function renderAttachments() {
        attachPreview.replaceChildren();
        for (const item of pendingAttachments) {
          const wrap = document.createElement("div");
          wrap.className = "attach-thumb";
          const img = document.createElement("img");
          img.src = item.objectUrl;
          img.alt = item.file.name || "Attached image";
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "attach-remove";
          remove.setAttribute("aria-label", `Remove ${item.file.name || "image"}`);
          remove.innerHTML =
            '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06"/></svg>';
          remove.addEventListener("click", () => removeAttachment(item.id));
          wrap.append(img, remove);
          attachPreview.appendChild(wrap);
        }
      }

      function clearAttachments() {
        for (const item of pendingAttachments) {
          URL.revokeObjectURL(item.objectUrl);
        }
        pendingAttachments = [];
        renderAttachments();
      }

      function removeAttachment(id) {
        const next = [];
        for (const item of pendingAttachments) {
          if (item.id === id) URL.revokeObjectURL(item.objectUrl);
          else next.push(item);
        }
        pendingAttachments = next;
        renderAttachments();
      }

      function addImageFiles(fileList) {
        if (!imageInputAvailable || activeController) return;
        const files = Array.from(fileList || []).filter(isAcceptedImageFile);
        if (!files.length) return;
        const room = MAX_ATTACHMENTS - pendingAttachments.length;
        if (room <= 0) {
          appendError({
            code: "invalid_request",
            message: `At most ${MAX_ATTACHMENTS} images per message.`,
          });
          return;
        }
        const accepted = files.slice(0, room);
        for (const file of accepted) {
          pendingAttachments.push({
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
            file,
            mediaType: normalizeMediaType(file.type),
            objectUrl: URL.createObjectURL(file),
          });
        }
        if (files.length > accepted.length) {
          appendError({
            code: "invalid_request",
            message: `Only ${MAX_ATTACHMENTS} images can be attached; extra files were skipped.`,
          });
        }
        renderAttachments();
      }

      /** @param {string | object[]} content */
      function contentText(content) {
        if (typeof content === "string") return content;
        if (!Array.isArray(content)) return "";
        return content
          .filter((part) => part && part.type === "text" && typeof part.text === "string")
          .map((part) => part.text)
          .join("\n");
      }

      /** @param {string | object[]} content */
      function contentImageSrcs(content) {
        if (!Array.isArray(content)) return [];
        /** @type {string[]} */
        const srcs = [];
        for (const part of content) {
          if (!part || part.type !== "image") continue;
          if (typeof part.url === "string") {
            srcs.push(part.url);
          } else if (part.data instanceof Blob) {
            srcs.push(URL.createObjectURL(part.data));
          } else if (typeof part.data === "string" && part.mediaType) {
            srcs.push(`data:${part.mediaType};base64,${part.data}`);
          }
        }
        return srcs;
      }

      function buildUserContent(text, attachments) {
        if (!attachments.length) return text;
        /** @type {object[]} */
        const parts = [];
        if (text) parts.push({ type: "text", text });
        for (const item of attachments) {
          parts.push({
            type: "image",
            mediaType: item.mediaType,
            data: item.file,
          });
        }
        return parts;
      }

      function setPrimaryMode(mode) {
        const stopping = mode === "stop";
        primaryBtn.dataset.mode = mode;
        primaryBtn.type = stopping ? "button" : "submit";
        primaryBtn.setAttribute(
          "aria-label",
          stopping ? "Stop generating" : "Send message",
        );
        primaryBtn.title = stopping ? "Stop" : "Send";
        sendIcon.hidden = stopping;
        stopIcon.hidden = !stopping;
      }

      function setBusy(busy) {
        const available = Boolean(window.inference);
        setPrimaryMode(busy ? "stop" : "send");
        primaryBtn.disabled = busy ? false : !available;
        input.disabled = busy || !available;
        if (!busy) activeController = null;
        syncWebSearchControl();
        syncAttachControl();
      }

      function appendMessage(role, content, { pending = false } = {}) {
        const el = document.createElement("div");
        el.className = `msg ${role}`;
        if (pending) el.classList.add("pending");
        if (role === "user" || role === "assistant") {
          const label = document.createElement("span");
          label.className = "label";
          label.textContent = role;
          el.appendChild(label);
        }
        if (role === "assistant") {
          const reasoning = document.createElement("details");
          reasoning.className = "reasoning";
          reasoning.open = true;
          const summary = document.createElement("summary");
          summary.textContent = "Reasoning";
          const reasoningBody = document.createElement("div");
          reasoningBody.className = "reasoning-body";
          reasoning.append(summary, reasoningBody);
          el.appendChild(reasoning);
        }
        if (pending) {
          const typing = document.createElement("span");
          typing.className = "typing";
          typing.setAttribute("aria-label", "Waiting for response");
          typing.innerHTML =
            '<span class="typing-label">Waiting</span><span class="typing-dots" aria-hidden="true"><span></span><span></span><span></span></span>';
          el.appendChild(typing);
        }
        const images = document.createElement("div");
        images.className = "msg-images";
        for (const src of contentImageSrcs(content)) {
          const img = document.createElement("img");
          img.src = src;
          img.alt = "Attached image";
          images.appendChild(img);
        }
        el.appendChild(images);
        const body = document.createElement("span");
        body.className = "body";
        body.textContent = contentText(content);
        el.appendChild(body);
        logEl.appendChild(el);
        logEl.scrollTop = logEl.scrollHeight;
        return body;
      }

      function clearPending(body) {
        const bubble = body.parentElement;
        if (!bubble || !bubble.classList.contains("pending")) return;
        bubble.classList.remove("pending");
        bubble.querySelector(".typing")?.remove();
      }

      function setPendingLabel(body, label) {
        const bubble = body.parentElement;
        const typing = bubble?.querySelector(".typing");
        const text = typing?.querySelector(".typing-label");
        if (!typing || !text) return;
        text.textContent = label;
        const aria =
          label === "Thinking"
            ? "Model is reasoning"
            : label === "Generating"
              ? "Generating response"
              : "Waiting for response";
        typing.setAttribute("aria-label", aria);
      }

      /** @returns {HTMLElement | null} */
      function ensureReasoning(body) {
        const bubble = body.parentElement;
        const reasoning = bubble?.querySelector(".reasoning");
        const reasoningBody = reasoning?.querySelector(".reasoning-body");
        if (!bubble || !reasoning || !reasoningBody) return null;
        bubble.classList.add("has-reasoning");
        reasoning.open = true;
        return reasoningBody;
      }

      function setReasoning(body, text) {
        const reasoningBody = ensureReasoning(body);
        if (!reasoningBody) return;
        reasoningBody.textContent = text;
        logEl.scrollTop = logEl.scrollHeight;
      }

      function appendReasoning(body, text) {
        const reasoningBody = ensureReasoning(body);
        if (!reasoningBody) return;
        reasoningBody.textContent += text;
        logEl.scrollTop = logEl.scrollHeight;
      }

      function appendMeta(text) {
        const el = document.createElement("div");
        el.className = "msg meta";
        el.textContent = text;
        logEl.appendChild(el);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function appendError(err) {
        const code = err && err.code ? err.code : "unknown";
        const message = err && err.message ? err.message : String(err);
        const el = document.createElement("div");
        el.className = "msg error";
        el.textContent = `${code}: ${message}`;
        logEl.appendChild(el);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function refreshAvailability() {
        if (
          window.inference &&
          typeof window.inference.request === "function"
        ) {
          statusEl.textContent = "ready";
          statusEl.className = "ready";
          setBusy(false);
          input.focus();
          return true;
        }
        statusEl.textContent = "unavailable";
        statusEl.className = "missing";
        primaryBtn.disabled = true;
        setPrimaryMode("send");
        input.disabled = true;
        syncWebSearchControl();
        syncAttachControl();
        return false;
      }

      async function sendMessage(content) {
        if (!refreshAvailability()) {
          appendError({
            code: "unavailable",
            message:
              "window.inference is missing. Install Inference Bridge and open this page over https or localhost.",
          });
          return;
        }

        // Re-check after refresh — toggle may have been cleared if unsupported.
        const useWebSearch = webSearchEnabled && getFeatures().webSearch === true;
        const useImageInput =
          Array.isArray(content) && getFeatures().imageInput === true;
        if (Array.isArray(content) && !useImageInput) {
          appendError({
            code: "unavailable",
            message:
              "Image input is unavailable (getFeatures().imageInput). Remove attachments or enable a vision-capable injector.",
          });
          return;
        }

        // Clear only after availability succeeds so a failed check keeps the draft.
        input.value = "";
        input.style.height = "auto";
        clearAttachments();

        history.push({ role: "user", content });
        const userBody = appendMessage("user", content);
        const assistantBody = appendMessage("assistant", "", { pending: true });
        let sawReasoning = false;
        activeController = new AbortController();
        setBusy(true);

        /** @type {{ role: string; content: string | object[] }[]} */
        const messages = useWebSearch
          ? [
              {
                role: "system",
                content: buildWebSearchSystemPrompt(),
              },
              ...history,
            ]
          : history;

        /** @type {Record<string, unknown>} */
        const request = {
          method: "chat",
          messages,
          signal: activeController.signal,
        };
        if (useWebSearch) {
          request.tools = [{ type: "web_search" }];
        }

        try {
          for await (const chunk of window.inference.request(request)) {
            if (chunk.type === "accepted") {
              setPendingLabel(assistantBody, "Generating");
            } else if (chunk.type === "reasoning_delta") {
              sawReasoning = true;
              appendReasoning(assistantBody, chunk.content);
              setPendingLabel(assistantBody, "Thinking");
            } else if (chunk.type === "delta") {
              clearPending(assistantBody);
              assistantBody.textContent += chunk.content;
              logEl.scrollTop = logEl.scrollHeight;
            } else if (chunk.type === "done") {
              clearPending(assistantBody);
              const doneContent = chunk.message.content;
              assistantBody.textContent =
                typeof doneContent === "string"
                  ? doneContent
                  : contentText(doneContent ?? "");
              if (chunk.message.reasoning) {
                setReasoning(assistantBody, chunk.message.reasoning);
                sawReasoning = true;
              }
              history.push({
                role: "assistant",
                content:
                  typeof doneContent === "string" || Array.isArray(doneContent)
                    ? doneContent
                    : assistantBody.textContent,
              });
              const parts = [`model ${chunk.model}`];
              if (useWebSearch) parts.push("search on");
              if (useImageInput) parts.push("image input");
              if (chunk.usage) {
                const { inputTokens, outputTokens } = chunk.usage;
                if (inputTokens != null) parts.push(`in ${inputTokens}`);
                if (outputTokens != null) parts.push(`out ${outputTokens}`);
              }
              appendMeta(parts.join(" · "));
            }
          }
        } catch (err) {
          if (!assistantBody.textContent) {
            // No reply content yet (with or without reasoning). Keep any
            // reasoning UI for context, but drop the unpaired user turn so
            // follow-ups aren't corrupted by an empty assistant message.
            if (!sawReasoning) assistantBody.parentElement.remove();
            else clearPending(assistantBody);
            const userBubble = userBody.parentElement;
            userBubble.classList.add("failed");
            const label = userBubble.querySelector(".label");
            if (label) label.textContent = "user · failed";
            history.pop();
          } else {
            clearPending(assistantBody);
            history.push({
              role: "assistant",
              content: assistantBody.textContent,
            });
          }
          appendError(err);
        } finally {
          setBusy(false);
          input.focus();
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = input.value.trim();
        const attachments = pendingAttachments.slice();
        if ((!text && !attachments.length) || activeController) return;
        if (attachments.length && !imageInputAvailable) {
          appendError({
            code: "unavailable",
            message: "Image input unavailable (getFeatures().imageInput).",
          });
          return;
        }
        sendMessage(buildUserContent(text, attachments));
      });

      primaryBtn.addEventListener("click", () => {
        if (primaryBtn.dataset.mode === "stop" && activeController) {
          activeController.abort();
        }
      });

      attachBtn.addEventListener("click", () => {
        if (!imageInputAvailable || activeController) return;
        attachInput.click();
      });

      attachInput.addEventListener("change", () => {
        addImageFiles(attachInput.files);
        attachInput.value = "";
      });

      webSearchBtn.addEventListener("click", () => {
        if (!webSearchAvailable || activeController) return;
        webSearchEnabled = !webSearchEnabled;
        syncWebSearchControl();
      });

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = `${Math.min(input.scrollHeight, 160)}px`;
      });

      input.addEventListener("paste", (event) => {
        if (!imageInputAvailable || activeController) return;
        const items = event.clipboardData?.items;
        if (!items?.length) return;
        /** @type {File[]} */
        const files = [];
        for (const item of items) {
          if (item.kind === "file" && item.type.startsWith("image/")) {
            const file = item.getAsFile();
            if (file) files.push(file);
          }
        }
        if (!files.length) return;
        event.preventDefault();
        addImageFiles(files);
      });

      form.addEventListener("dragenter", (event) => {
        if (!imageInputAvailable || activeController) return;
        if (![...event.dataTransfer.items].some((i) => i.kind === "file")) return;
        event.preventDefault();
        dragDepth += 1;
        form.classList.add("dragover");
      });

      form.addEventListener("dragover", (event) => {
        if (!imageInputAvailable || activeController) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "copy";
      });

      form.addEventListener("dragleave", (event) => {
        if (!imageInputAvailable) return;
        event.preventDefault();
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) form.classList.remove("dragover");
      });

      form.addEventListener("drop", (event) => {
        if (!imageInputAvailable || activeController) return;
        event.preventDefault();
        dragDepth = 0;
        form.classList.remove("dragover");
        addImageFiles(event.dataTransfer.files);
      });

      if (!refreshAvailability()) {
        appendMeta(
          "window.inference is missing — install Inference Bridge and open this page over https or localhost.",
        );
      }
    </script>
  </body>
</html>
