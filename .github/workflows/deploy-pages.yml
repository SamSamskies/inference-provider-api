name: Deploy examples to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site/chat _site/social/avatars _site/translate _site/nostr _site/prompt-api-fallback
          cp examples/index.html _site/index.html
          cp examples/chat/index.html _site/chat/index.html
          cp examples/social/index.html _site/social/index.html
          cp examples/social/data.json _site/social/data.json
          cp examples/social/avatars/* _site/social/avatars/
          cp examples/translate/index.html _site/translate/index.html
          cp examples/nostr/index.html _site/nostr/index.html
          cp examples/nostr/data.json _site/nostr/data.json
          cp examples/prompt-api-fallback/index.html _site/prompt-api-fallback/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
